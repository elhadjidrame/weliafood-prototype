<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Page non trouvée - Weliafood</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/reset.css">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/layout.css">
    <link rel="stylesheet" href="/styles/components/buttons.css">

    <style>
        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
            padding: var(--space-8);
        }

        .error-page__code {
            font-size: 6rem;
            font-weight: 700;
            color: var(--color-primary-500);
            line-height: 1;
            margin-bottom: var(--space-4);
        }

        .error-page__title {
            font-size: 2rem;
            margin-bottom: var(--space-4);
        }

        .error-page__description {
            color: var(--color-text-secondary);
            margin-bottom: var(--space-8);
            max-width: 480px;
        }

        .error-page__actions {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-4);
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="page">
        <header class="header">
            <div class="header__container">
                <a href="index.html" class="header__logo">
                    WeliaFood<span class="header__logo-dot">.</span>
                </a>
                <div class="header__actions">
                    <a href="contact.html" class="btn btn--primary btn--sm">Nous contacter</a>
                </div>
            </div>
        </header>

        <main class="main">
            <div class="container">
                <div class="error-page">
                    <div class="error-page__code">404</div>
                    <h1 class="error-page__title">Page non trouvée</h1>
                    <p class="error-page__description">
                        La page que vous recherchez n'existe pas ou a été déplacée.
                        Pas d'inquiétude, vous pouvez retrouver nos produits et informations
                        depuis les liens ci-dessous.
                    </p>
                    <div class="error-page__actions">
                        <a href="index.html" class="btn btn--primary">Retour à l'accueil</a>
                        <a href="categorie.html" class="btn btn--white">Voir nos produits</a>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer__container">
                <div class="footer__bottom">
                    <p class="footer__copyright">© 2026 Weliafood. Tous droits réservés.</p>
                </div>
            </div>
        </footer>
    </div>
</body>

</html>

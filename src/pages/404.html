            padding: var(--space-8);

            color: var(--color-primary-500);

            margin-bottom: var(--space-4);

            font-size: 2rem;

        }

        .error-page__description {
            color: var(--color-text-secondary);
            margin-bottom: var(--space-8);
            max-width: 480px;
        }

        .error-page__actions {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-4);
